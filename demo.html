<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Emotion Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center">

  <h1 class="text-3xl font-bold mt-8">
    Emotion Demo
  </h1>

  <div class="mt-6 bg-gray-900 p-4 rounded-xl shadow-lg">
    <video id="video"
           width="800"
           autoplay
           playsinline
           class="rounded-lg">
    </video>
  </div>

  <div id="emotion"
       class="mt-6 text-xl font-semibold">
    Emotion: —
  </div>

<script>
async function startCamera() {
  const video = document.getElementById("video");

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true
    });
    video.srcObject = stream;
  } catch (err) {
    console.error("Camera error:", err);
    alert("Kamera konnte nicht gestartet werden");
  }
}

startCamera();
</script>

</body>

</html>
