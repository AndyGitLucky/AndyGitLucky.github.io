  <!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Emotion Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center">

  <h1 class="text-3xl font-bold mt-8">
    Emotion Demo
  </h1>

  <div class="mt-6 bg-gray-900 p-4 rounded-xl shadow-lg relative">
    <video id="video"
           width="800"
           autoplay
           muted 
           playsinline
           class="rounded-lg">
    </video>
    <canvas id="overlay"
        width="800"
        height="450"
        class="absolute top-0 left-0 pointer-events-none">
    </canvas>
    <canvas id="debugCanvas"
        width="48"
        height="48"
        class="mt-4 border border-gray-700">
    </canvas>
  </div>

  <div id="emotion"
       class="mt-6 text-xl font-semibold">
    Emotion: —
  </div>

<script>
const video = document.getElementById("video");

async function testBlazeFace() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    await video.play();

    const faceModel = await blazeface.load();
    console.log("BlazeFace loaded");

    setInterval(async () => {
      const faces = await faceModel.estimateFaces(video, false);
      console.log("Faces:", faces);
    }, 1000);

  } catch (e) {
    console.error("ERROR:", e);
  }
}

testBlazeFace();
</script>



</body>

</html>
