<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.ico">

  <title>Emotion Demo (ONNX)</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- TensorFlow.js (REQUIRED for BlazeFace) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>

  <!-- BlazeFace -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

  <!-- ONNX Runtime Web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center">

<h1 class="text-3xl font-bold mt-8">
  Emotion Demo (ONNX)
</h1>

<div class="mt-6 bg-gray-900 p-4 rounded-xl shadow-lg relative">
  <video id="video"
         width="800"
         autoplay
         muted
         playsinline
         class="rounded-lg"></video>

  <canvas id="overlay"
          width="800"
          height="450"
          class="absolute top-4 left-4 pointer-events-none"></canvas>

  <canvas id="debugCanvas"
          width="48"
          height="48"
          class="mt-4 border border-gray-700
                w-24 h-24
                image-rendering-pixelated"></canvas>
</div>

<!-- Emotion Display (stable, two-line) -->
<div class="mt-8 w-[26rem] text-center">
  <div id="emotionLabel"
       class="text-4xl md:text-5xl font-bold tracking-tight">
    —
  </div>
  <div id="emotionConfidence"
       class="mt-2 text-sm md:text-base text-gray-400">
    —
  </div>
</div>



<script>
/* =======================
   SETUP
======================= */

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");

const canvas = document.getElementById("debugCanvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

const faceCanvas = document.createElement("canvas");
const faceCtx = faceCanvas.getContext("2d");

const EMOTIONS = [
  "Angry", "Disgusted", "Fearful",
  "Happy", "Sad", "Surprised", "Neutral"
];

const SMOOTHING = 5;
let scoreHistory = [];

const FACE_HOLD_MS = 1000;
let lastFaceTime = 0;

let faceModel = null;
let session = null;
let lastFaceBox = null;
let lastFaceCheck = 0;
const SQUARE_PADDING = 1.0; // scale the square slightly larger than detected box

// UI update rate limiting
let lastUIUpdate = 0;
const UI_UPDATE_MS = 300;

// Emotion stability filtering
const STABLE_FRAMES = 5;   // Number of consecutive frames required to accept a new emotion

let displayedEmotion = null;   // Emotion currently shown in the UI
let candidateEmotion = null;   // Potential new emotion
let candidateCount = 0;        // How many times the candidate was seen consecutively


/* =======================
   LOAD MODELS
======================= */

async function loadModels() {
  console.log("Initializing TFJS backend...");
  //await tf.setBackend("webgl");
  await tf.setBackend("cpu");
  await tf.ready();

  console.log("Loading BlazeFace…");
  faceModel = await blazeface.load();
  console.log("BlazeFace loaded");

  console.log("Loading ONNX model…");
  session = await ort.InferenceSession.create("emotion_model.onnx");
  console.log("ONNX model loaded");
}


/* =======================
   CAMERA
======================= */

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    console.log('Camera stream obtained');
    video.srcObject = stream;

    // Wait for metadata so video.videoWidth/videoHeight become available
    await new Promise((resolve) => {
      if (video.readyState >= 1) return resolve();
      video.addEventListener('loadedmetadata', resolve, { once: true });
    });

    // Ensure overlay is sized to the video's natural pixel size and matches CSS size
    overlay.width = video.videoWidth || overlay.width;
    overlay.height = video.videoHeight || overlay.height;
    const videoRect = video.getBoundingClientRect();
    overlay.style.width = `${videoRect.width}px`;
    overlay.style.height = `${videoRect.height}px`;

    await video.play();
    processFrame();
  } catch (err) {
    console.error('Error accessing camera', err);
  
    const labelEl = document.getElementById("emotionLabel");
    const confEl  = document.getElementById("emotionConfidence");
  
    if (labelEl) labelEl.textContent = "Camera not available";
    if (confEl)  confEl.textContent = err.name || err.message;
    }
}

/* =======================
   MAIN LOOP
======================= */

async function processFrame() {
  if (video.videoWidth === 0 || video.videoHeight === 0) {
    setTimeout(() => requestAnimationFrame(processFrame), 150);
    return;
  }

  // 🔧 FIX: Overlay an echtes Video koppeln
  // Ensure the overlay canvas internal pixel size matches the video's natural pixels
  // and set the CSS size so the canvas visually lines up with the displayed video.
  const videoRect = video.getBoundingClientRect();
  if (
    overlay.width !== video.videoWidth ||
    overlay.height !== video.videoHeight ||
    overlay.style.width !== `${videoRect.width}px` ||
    overlay.style.height !== `${videoRect.height}px`
  ) {
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    overlay.style.width = `${videoRect.width}px`;
    overlay.style.height = `${videoRect.height}px`;
  }

  /* ---- Face detection (throttled) ---- */
  if (Date.now() - lastFaceCheck > 600) {
    lastFaceCheck = Date.now();
    const faces = await faceModel.estimateFaces(video, false);

    if (faces.length > 0) {
      const f = faces[0]; 
      const [x1, y1] = f.topLeft;
      const [x2, y2] = f.bottomRight;

      // Make the bounding box quadratic (square), centered on the detected box
      let x = x1;
      let y = y1;
      let w = Math.max(1, x2 - x1);
      let h = Math.max(1, y2 - y1);

      // choose square size from the larger dimension and apply padding
      let size = Math.max(w, h) * SQUARE_PADDING;

      // If size exceeds video dimensions, cap it
      const vw = video.videoWidth || overlay.width || 1;
      const vh = video.videoHeight || overlay.height || 1;
      if (size > Math.min(vw, vh)) size = Math.min(vw, vh);

      // center on original box center
      const cx = x + w / 2;
      const cy = y + h / 2;
      let sx = Math.max(0, cx - size / 2);
      let sy = Math.max(0, cy - size / 2);

      // clamp to video bounds
      if (sx + size > vw) sx = Math.max(0, vw - size);
      if (sy + size > vh) sy = Math.max(0, vh - size);

      lastFaceBox = {
        x: sx,
        y: sy,
        w: size,
        h: size
      };
      lastFaceTime = Date.now();
    } else {
      if (Date.now() - lastFaceTime > FACE_HOLD_MS) {
        lastFaceBox = null;
      }
    }
  }
  // ---- Overlay ----
  octx.clearRect(0, 0, overlay.width, overlay.height);

  if (lastFaceBox) {
  // Draw using the overlay's internal canvas coordinate space (which we set
  // to match the video's natural pixel size). Map face box from video pixels
  // to canvas pixels using a simple scale (normally 1), keeping it robust.
  const scaleX = overlay.width / video.videoWidth;
  const scaleY = overlay.height / video.videoHeight;

  octx.strokeStyle = "lime";
  octx.lineWidth = 3;

  octx.strokeRect(
    lastFaceBox.x * scaleX,
    lastFaceBox.y * scaleY,
    lastFaceBox.w * scaleX,
    lastFaceBox.h * scaleY
  );
}



  if (!lastFaceBox) {
    requestAnimationFrame(processFrame);
    return;
  }

  /* ---- Face crop ---- */
  faceCanvas.width = lastFaceBox.w;
  faceCanvas.height = lastFaceBox.h;

  faceCtx.drawImage(
    video,
    lastFaceBox.x, lastFaceBox.y,
    lastFaceBox.w, lastFaceBox.h,
    0, 0,
    faceCanvas.width, faceCanvas.height
  );

// Resize Face → 48x48
ctx.drawImage(faceCanvas, 0, 0, 48, 48);

// RGB lesen
const imageData = ctx.getImageData(0, 0, 48, 48);
const data = imageData.data;

// DAS ist der Modell-Input (Single Source of Truth)
const input = new Float32Array(48 * 48);

// Grayscale + Normalisierung
for (let i = 0, j = 0; i < data.length; i += 4, j++) {
  const gray =
    0.299 * data[i] +
    0.587 * data[i + 1] +
    0.114 * data[i + 2];

  const norm = gray / 255.0;
  input[j] = norm;

  // 🔥 WICHTIG: Debug-Canvas exakt auf Modell-Input setzen
  const g = Math.round(norm * 255);
  data[i]     = g;
  data[i + 1] = g;
  data[i + 2] = g;
}

// Jetzt sieht das Canvas GENAU das, was das Modell sieht
ctx.putImageData(imageData, 0, 0);



/* ---- ONNX inference ---- */
if (session) {
// Create ONNX tensor (model input stays unchanged)
const tensor = new ort.Tensor("float32", input, [1, 48, 48, 1]);
const feeds = {};
feeds[session.inputNames[0]] = tensor;

// Run inference
const results = await session.run(feeds);
const scores = Array.from(results[session.outputNames[0]].data);

// Temporal smoothing of softmax outputs
scoreHistory.push(scores);
if (scoreHistory.length > SMOOTHING) scoreHistory.shift();

const avg = scores.map((_, i) =>
  scoreHistory.reduce((s, v) => s + v[i], 0) / scoreHistory.length
);

// Current raw prediction
const maxIdx = avg.indexOf(Math.max(...avg));
const currentEmotion = EMOTIONS[maxIdx];

  /* ------------------------------
    Emotion stability gate
  ------------------------------ */

  if (currentEmotion === displayedEmotion) {
    // Emotion is stable, reset candidate state
    candidateEmotion = null;
    candidateCount = 0;

  } else {
    if (currentEmotion === candidateEmotion) {
      candidateCount++;

      // Accept new emotion only after N stable frames
      if (candidateCount >= STABLE_FRAMES) {
        displayedEmotion = currentEmotion;
        candidateEmotion = null;
        candidateCount = 0;
      }

    } else {
      // New candidate emotion detected
      candidateEmotion = currentEmotion;
      candidateCount = 1;
    }
  }

  /* ------------------------------
     UI update (rate-limited)
     ------------------------------ */

  const now = Date.now();
  // Initialize displayed emotion on first prediction
  if (!displayedEmotion) {
    displayedEmotion = currentEmotion;
  }
    // Update UI only if emotion is stable and rate limit has passed
    const labelEl = document.getElementById("emotionLabel");
    const confEl  = document.getElementById("emotionConfidence");

    // Confidence based on smoothed softmax
    const confidencePercent = Math.round(avg[maxIdx] * 100);

    // Human-readable confidence levels
    let confidenceText = "uncertain";
    if (confidencePercent >= 70) confidenceText = "confident";
    if (confidencePercent >= 85) confidenceText = "very confident";

    // Update UI (two-line display)
    labelEl.textContent = displayedEmotion;
    confEl.textContent =
      `Confidence: ${confidenceText} (${confidencePercent}%)`;

    lastUIUpdate = now;
  }
  

  requestAnimationFrame(processFrame);
}

/* =======================
   START
======================= */

(async () => {
  await loadModels();
  await startCamera();
})();
</script>

</body>
</html>
