<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.ico">

  <title>Emotion Demo (ONNX)</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- TensorFlow.js (REQUIRED for BlazeFace) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>

  <!-- BlazeFace -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

  <!-- ONNX Runtime Web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center">

<h1 class="text-3xl font-bold mt-8">
  Emotion Demo (ONNX)
</h1>

<div class="mt-6 bg-gray-900 p-4 rounded-xl shadow-lg relative">
  <video id="video"
         width="800"
         autoplay
         muted
         playsinline
         class="rounded-lg"></video>

  <canvas id="overlay"
          width="800"
          height="450"
          class="absolute top-4 left-4 pointer-events-none"></canvas>

  <canvas id="debugCanvas"
          width="48"
          height="48"
          class="mt-4 border border-gray-700
                w-24 h-24
                image-rendering-pixelated"></canvas>
</div>

<!-- Emotion Display (stable, two-line) -->
<div class="mt-8 w-[26rem] text-center">
  <div id="emotionLabel"
       class="text-4xl md:text-5xl font-bold tracking-tight">
    —
  </div>
  <div id="emotionConfidence"
       class="mt-2 text-sm md:text-base text-gray-400">
    —
  </div>
</div>

<script>
/* =======================
   SETUP & CONFIGURATION
======================= */

// DOM elements
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");
const canvas = document.getElementById("debugCanvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

// Face canvas (reused, fixed size to prevent reallocation)
const faceCanvas = document.createElement("canvas");
const faceCtx = faceCanvas.getContext("2d");
faceCanvas.width = 128;
faceCanvas.height = 128;

// Emotion labels
const EMOTIONS = [
  "Angry", "Disgusted", "Fearful",
  "Happy", "Sad", "Surprised", "Neutral"
];

// Mobile detection for performance tuning
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

// Pre-allocated buffers (prevents garbage collection pressure)
const input = new Float32Array(48 * 48);  // Model input buffer

// Score smoothing: pre-allocate circular buffer of Float32Arrays
const SMOOTHING = 5;
const scoreBuffers = Array.from({ length: SMOOTHING }, () => new Float32Array(7));
let scoreIndex = 0;

// Face detection configuration
const FACE_HOLD_MS = 1000;  // Keep last face for 1s after losing detection
const SQUARE_PADDING = 1.0;  // Padding factor for face bounding box
let lastFaceTime = 0;
let lastFaceBox = null;
let lastFaceCheck = 0;

// Emotion stability: require new emotion to be stable before displaying
const STABLE_TIME = 700;  // milliseconds
let candidateSince = 0;
let displayedEmotion = null;   // Currently shown emotion
let candidateEmotion = null;   // Potential new emotion

// Model references
let faceModel = null;
let session = null;

// Reusable ONNX tensor (prevents WASM heap growth)
let tensor = new ort.Tensor("float32", new Float32Array(48*48), [1,48,48,1]);

// Throttling for performance
let lastInference = 0;
const INFERENCE_MS = isMobile ? 700 : 500;  // Slower on mobile (2 FPS vs 1.4 FPS)

/* =======================
   LOAD MODELS
======================= */

async function loadModels() {
  try {
    console.log("Initializing TensorFlow.js backend...");
    
    // WebGL is faster than CPU on most devices
    await tf.setBackend("webgl");
    await tf.ready();
    
    console.log("✓ TF Backend:", tf.getBackend());

    console.log("Loading BlazeFace...");
    faceModel = await blazeface.load();
    console.log("✓ BlazeFace loaded");

    console.log("Loading ONNX emotion model...");
    session = await ort.InferenceSession.create("emotion_model.onnx");
    console.log("✓ ONNX model loaded");
  } catch (err) {
    console.error("✗ Model loading failed:", err);
    
    // Show user-friendly error
    const labelEl = document.getElementById("emotionLabel");
    const confEl = document.getElementById("emotionConfidence");
    
    if (err.message.includes("Failed to fetch") || err.message.includes("404")) {
      if (labelEl) labelEl.textContent = "Model file not found";
      if (confEl) confEl.textContent = "Make sure emotion_model.onnx is in the same folder";
    } else {
      if (labelEl) labelEl.textContent = "Error loading models";
      if (confEl) confEl.textContent = err.message;
    }
    
    throw err;
  }
}

/* =======================
   CAMERA SETUP
======================= */

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    console.log('✓ Camera stream obtained');
    video.srcObject = stream;

    // Wait for video metadata to be loaded
    await new Promise((resolve) => {
      if (video.readyState >= 1) return resolve();
      video.addEventListener('loadedmetadata', resolve, { once: true });
    });

    // Size overlay canvas to match video dimensions
    overlay.width = video.videoWidth || overlay.width;
    overlay.height = video.videoHeight || overlay.height;
    const videoRect = video.getBoundingClientRect();
    overlay.style.width = `${videoRect.width}px`;
    overlay.style.height = `${videoRect.height}px`;

    await video.play();
    console.log('✓ Camera started');
    
    processFrame();
  } catch (err) {
    console.error('✗ Error accessing camera:', err);
  
    const labelEl = document.getElementById("emotionLabel");
    const confEl = document.getElementById("emotionConfidence");
  
    if (labelEl) labelEl.textContent = "Camera not available";
    if (confEl) confEl.textContent = err.name || err.message;
  }
}

/* =======================
   MAIN PROCESSING LOOP
======================= */

async function processFrame() {
  // Wait for video to be ready
  if (video.videoWidth === 0 || video.videoHeight === 0) {
    setTimeout(() => requestAnimationFrame(processFrame), 150);
    return;
  }

  // Ensure overlay stays synchronized with video dimensions
  const videoRect = video.getBoundingClientRect();
  if (
    overlay.width !== video.videoWidth ||
    overlay.height !== video.videoHeight ||
    overlay.style.width !== `${videoRect.width}px` ||
    overlay.style.height !== `${videoRect.height}px`
  ) {
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    overlay.style.width = `${videoRect.width}px`;
    overlay.style.height = `${videoRect.height}px`;
  }

  /* ==========================================
     FACE DETECTION (throttled to ~1.67 FPS)
  ========================================== */
  if (Date.now() - lastFaceCheck > 600) {
    lastFaceCheck = Date.now();
    
    try {
      // BlazeFace handles its own tensor cleanup
      const faces = await faceModel.estimateFaces(video, false);

      if (faces.length > 0) {
        const f = faces[0]; 
        const [x1, y1] = f.topLeft;
        const [x2, y2] = f.bottomRight;

        // Calculate detected face dimensions
        let x = x1;
        let y = y1;
        let w = Math.max(1, x2 - x1);
        let h = Math.max(1, y2 - y1);

        // Make bounding box square (model expects square input)
        let size = Math.max(w, h) * SQUARE_PADDING;

        // Clamp to video dimensions
        const vw = video.videoWidth || overlay.width || 1;
        const vh = video.videoHeight || overlay.height || 1;
        if (size > Math.min(vw, vh)) size = Math.min(vw, vh);

        // Center square on detected face
        const cx = x + w / 2;
        const cy = y + h / 2;
        let sx = Math.max(0, cx - size / 2);
        let sy = Math.max(0, cy - size / 2);

        // Ensure box stays within video bounds
        if (sx + size > vw) sx = Math.max(0, vw - size);
        if (sy + size > vh) sy = Math.max(0, vh - size);

        lastFaceBox = {
          x: sx,
          y: sy,
          w: size,
          h: size
        };
        lastFaceTime = Date.now();
      } else {
        // Keep last face box for FACE_HOLD_MS after losing detection
        if (Date.now() - lastFaceTime > FACE_HOLD_MS) {
          lastFaceBox = null;
        }
      }
    } catch (err) {
      console.error('✗ Face detection error:', err);
    }
  }

  /* ==========================================
     DRAW FACE BOUNDING BOX
  ========================================== */
  octx.clearRect(0, 0, overlay.width, overlay.height);

  if (lastFaceBox) {
    // Scale coordinates from video pixels to canvas pixels
    const scaleX = overlay.width / video.videoWidth;
    const scaleY = overlay.height / video.videoHeight;

    octx.strokeStyle = "lime";
    octx.lineWidth = 3;

    octx.strokeRect(
      lastFaceBox.x * scaleX,
      lastFaceBox.y * scaleY,
      lastFaceBox.w * scaleX,
      lastFaceBox.h * scaleY
    );
  }

  // No face detected, skip inference
  if (!lastFaceBox) {
    requestAnimationFrame(processFrame);
    return;
  }

  /* ==========================================
     CROP FACE FROM VIDEO
  ========================================== */
  // Draw detected face region to fixed-size canvas
  faceCtx.drawImage(
    video,
    lastFaceBox.x, lastFaceBox.y,
    lastFaceBox.w, lastFaceBox.h,
    0, 0,
    faceCanvas.width, faceCanvas.height
  );

  /* ==========================================
     EMOTION INFERENCE (throttled to 2 FPS / 1.4 FPS on mobile)
  ========================================== */
  if (session && Date.now() - lastInference > INFERENCE_MS) {
    lastInference = Date.now();

    // Resize cropped face to 48x48 (model input size)
    ctx.drawImage(faceCanvas, 0, 0, 48, 48);

    // Get pixel data
    const imageData = ctx.getImageData(0, 0, 48, 48);
    const data = imageData.data;

    // Convert to grayscale and normalize to [0, 1]
    for (let i = 0, j = 0; i < data.length; i += 4, j++) {
      const gray =
        0.299 * data[i] +      // Red
        0.587 * data[i + 1] +  // Green
        0.114 * data[i + 2];   // Blue

      const norm = gray / 255.0;
      input[j] = norm;

      // Update debug canvas to show what model sees
      const g = Math.round(norm * 255);
      data[i]     = g;
      data[i + 1] = g;
      data[i + 2] = g;
    }

    // Update debug canvas (only during inference, not every frame)
    ctx.putImageData(imageData, 0, 0);

    // Reuse tensor (prevents WASM heap growth)
    tensor.data.set(input);

    const feeds = {};
    feeds[session.inputNames[0]] = tensor;

    // Run ONNX inference
    const results = await session.run(feeds);
    const scores = results[session.outputNames[0]].data;

    /* ==========================================
       TEMPORAL SMOOTHING
    ========================================== */
    // Store scores in circular buffer (reuses allocated arrays)
    scoreBuffers[scoreIndex].set(scores);
    scoreIndex = (scoreIndex + 1) % SMOOTHING;

    // Calculate smoothed average across last N predictions
    const avg = new Array(7);
    for (let i = 0; i < 7; i++) {
      let sum = 0;
      for (let j = 0; j < SMOOTHING; j++) {
        sum += scoreBuffers[j][i];
      }
      avg[i] = sum / SMOOTHING;
    }

    // Get current prediction
    const maxIdx = avg.indexOf(Math.max(...avg));
    const currentEmotion = EMOTIONS[maxIdx];

    /* ==========================================
       EMOTION STABILITY FILTER
    ========================================== */
    // Require new emotion to be stable for STABLE_TIME ms before displaying
    if (currentEmotion === displayedEmotion) {
      // Current emotion is stable, reset candidate
      candidateEmotion = null;
      candidateSince = 0;

    } else {
      // Different emotion detected
      if (currentEmotion !== candidateEmotion) {
        // New candidate emotion
        candidateEmotion = currentEmotion;
        candidateSince = Date.now();
      }

      // Check if candidate has been stable long enough
      if (Date.now() - candidateSince > STABLE_TIME) {
        displayedEmotion = candidateEmotion;
        candidateEmotion = null;
      }
    }

    /* ==========================================
       UPDATE UI
    ========================================== */
    // Initialize displayed emotion on first prediction
    if (!displayedEmotion) {
      displayedEmotion = currentEmotion;
    }

    const labelEl = document.getElementById("emotionLabel");
    const confEl = document.getElementById("emotionConfidence");

    // Calculate confidence percentage
    const confidencePercent = Math.round(avg[maxIdx] * 100);

    // Human-readable confidence levels
    let confidenceText = "uncertain";
    if (confidencePercent >= 70) confidenceText = "confident";
    if (confidencePercent >= 85) confidenceText = "very confident";

    // Update display
    labelEl.textContent = displayedEmotion;
    confEl.textContent = `Confidence: ${confidenceText} (${confidencePercent}%)`;
  }

  // Continue loop
  requestAnimationFrame(processFrame);
}

/* =======================
   MEMORY MONITORING
======================= */

// Monitor memory usage (helpful for debugging mobile crashes)
if (performance.memory) {
  setInterval(() => {
    const used = (performance.memory.usedJSHeapSize / 1048576).toFixed(0);
    const limit = (performance.memory.jsHeapSizeLimit / 1048576).toFixed(0);
    console.log(`Memory: ${used}MB / ${limit}MB | TF Tensors: ${tf.memory().numTensors}`);
  }, 10000);  // Every 10 seconds
}

/* =======================
   WEBGL CONTEXT LOSS HANDLER
======================= */

// Handle WebGL context loss (can happen on mobile under memory pressure)
canvas.addEventListener('webglcontextlost', (event) => {
  console.error('✗ WebGL context lost');
  event.preventDefault();
}, false);

/* =======================
   START APPLICATION
======================= */

(async () => {
  try {
    await loadModels();
    await startCamera();
    console.log('✓ Application ready');
  } catch (err) {
    console.error('✗ Startup error:', err);
  }
})();
</script>

</body>
</html>
