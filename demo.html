<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Emotion Demo (ONNX)</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Face detection -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

  <!-- ONNX Runtime Web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center">

<h1 class="text-3xl font-bold mt-8">
  Emotion Demo (ONNX)
</h1>

<div class="mt-6 bg-gray-900 p-4 rounded-xl shadow-lg relative">
  <video id="video"
         width="800"
         autoplay
         muted
         playsinline
         class="rounded-lg"></video>

  <canvas id="overlay"
          width="800"
          height="450"
          class="absolute top-0 left-0 pointer-events-none"></canvas>

  <canvas id="debugCanvas"
          width="48"
          height="48"
          class="mt-4 border border-gray-700"></canvas>
</div>

<div id="emotion" class="mt-6 text-xl font-semibold">
  Emotion: —
</div>

<script>
/* =======================
   SETUP
======================= */

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");

const canvas = document.getElementById("debugCanvas");
const ctx = canvas.getContext("2d");

const faceCanvas = document.createElement("canvas");
const faceCtx = faceCanvas.getContext("2d");

const EMOTIONS = [
  "Angry", "Disgusted", "Fearful",
  "Happy", "Sad", "Surprised", "Neutral"
];

const SMOOTHING = 5;
let scoreHistory = [];

let faceModel = null;
let session = null;
let lastFaceBox = null;
let lastFaceCheck = 0;

/* =======================
   LOAD MODELS
======================= */

async function loadModels() {
  console.log("Loading BlazeFace…");
  faceModel = await blazeface.load();
  console.log("BlazeFace loaded");

  console.log("Loading ONNX model…");
  session = await ort.InferenceSession.create("emotion_model.onnx");
  console.log("ONNX model loaded");
}

/* =======================
   CAMERA
======================= */

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  await video.play();
  processFrame();
}

/* =======================
   MAIN LOOP
======================= */

async function processFrame() {
  if (video.videoWidth === 0) {
    requestAnimationFrame(processFrame);
    return;
  }

  /* ---- Face detection (throttled) ---- */
  if (Date.now() - lastFaceCheck > 500) {
    lastFaceCheck = Date.now();
    const faces = await faceModel.estimateFaces(video, false);

    if (faces.length > 0) {
      const f = faces[0]; 
      const [x1, y1] = f.topLeft;
      const [x2, y2] = f.bottomRight;

      lastFaceBox = {
        x: Math.max(0, x1),
        y: Math.max(0, y1),
        w: Math.max(1, x2 - x1),
        h: Math.max(1, y2 - y1)
      };
    } else {
      lastFaceBox = null;
    }
  }

  /* ---- Overlay ---- */
  octx.clearRect(0, 0, overlay.width, overlay.height);
  if (lastFaceBox) {
    octx.strokeStyle = "lime";
    octx.lineWidth = 3;
    octx.strokeRect(
      lastFaceBox.x,
      lastFaceBox.y,
      lastFaceBox.w,
      lastFaceBox.h
    );
  }

  if (!lastFaceBox) {
    requestAnimationFrame(processFrame);
    return;
  }

  /* ---- Face crop ---- */
  faceCanvas.width = lastFaceBox.w;
  faceCanvas.height = lastFaceBox.h;

  faceCtx.drawImage(
    video,
    lastFaceBox.x, lastFaceBox.y,
    lastFaceBox.w, lastFaceBox.h,
    0, 0,
    faceCanvas.width, faceCanvas.height
  );

  /* ---- Resize to 48×48 ---- */
  ctx.drawImage(faceCanvas, 0, 0, 48, 48);

  /* ---- Grayscale + normalize ---- */
  const img = ctx.getImageData(0, 0, 48, 48).data;
  const input = new Float32Array(48 * 48);

  for (let i = 0, j = 0; i < img.length; i += 4, j++) {
    input[j] = (0.299 * img[i] +
                0.587 * img[i + 1] +
                0.114 * img[i + 2]) / 255.0;
  }

  /* ---- ONNX inference ---- */
  if (session) {
    const tensor = new ort.Tensor("float32", input, [1, 48, 48, 1]);
    const feeds = {};
    feeds[session.inputNames[0]] = tensor;

    const results = await session.run(feeds);
    const scores = Array.from(results[session.outputNames[0]].data);

    scoreHistory.push(scores);
    if (scoreHistory.length > SMOOTHING) scoreHistory.shift();

    const avg = scores.map((_, i) =>
      scoreHistory.reduce((s, v) => s + v[i], 0) / scoreHistory.length
    );

    const maxIdx = avg.indexOf(Math.max(...avg));
    const confidence = (avg[maxIdx] * 100).toFixed(1);

    document.getElementById("emotion").innerText =
      `Emotion: ${EMOTIONS[maxIdx]} (${confidence}%)`;
  }

  requestAnimationFrame(processFrame);
}

/* =======================
   START
======================= */

(async () => {
  await loadModels();
  await startCamera();
})();
</script>

</body>
</html>
