<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Emotion Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center">

  <h1 class="text-3xl font-bold mt-8">
    Emotion Demo
  </h1>

  <div class="mt-6 bg-gray-900 p-4 rounded-xl shadow-lg">
    <video id="video"
           width="800"
           autoplay
           playsinline
           class="rounded-lg">
    </video>
    <canvas id="debugCanvas"
        width="48"
        height="48"
        class="mt-4 border border-gray-700">
    </canvas>
  </div>

  <div id="emotion"
       class="mt-6 text-xl font-semibold">
    Emotion: —
  </div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("debugCanvas");
const ctx = canvas.getContext("2d");

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    requestAnimationFrame(processFrame);
  } catch (err) {
    console.error("Camera error:", err);
  }
}

function processFrame() {
  // Draw current frame scaled to 48x48
  ctx.drawImage(video, 0, 0, 48, 48);

  // Convert to grayscale
  const imageData = ctx.getImageData(0, 0, 48, 48);
  const data = imageData.data;

  for (let i = 0; i < data.length; i += 4) {
    const gray =
      0.299 * data[i] +
      0.587 * data[i + 1] +
      0.114 * data[i + 2];

    data[i] = gray;
    data[i + 1] = gray;
    data[i + 2] = gray;
  }

  ctx.putImageData(imageData, 0, 0);

  requestAnimationFrame(processFrame);
}

startCamera();
</script>


</body>

</html>
